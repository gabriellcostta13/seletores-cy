<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Seletores CSS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            color: #2d2d2d;
            background-color: #f4f4f4;
        }

        h1 {
            max-width: 600px;
            margin: 0 auto 8px;
            color: #333;
            font-size: 28px;
        }

        .introducao {
            max-width: 600px;
            margin: 0 auto 28px;
            color: #666;
            line-height: 1.5;
        }

        .pai,
        .pai-tio-1,
        .pai-tio-2 {
            max-width: 600px;
            margin: 0 auto 20px;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }

        .pai::before,
        .pai-tio-1::before,
        .pai-tio-2::before {
            display: block;
            margin-bottom: 18px;
            color: #555;
            font-size: 14px;
            font-weight: bold;
        }

        .pai::before {
            content: "Escolha um familiar para participar da conversa:";
        }

        .pai-tio-1::before {
            content: "Outros participantes:";
        }

        .pai-tio-2::before {
            content: "Deixe sua avaliação:";
        }

        .pai ul {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0;
            margin: 0 0 18px;
            list-style: none;
        }

        .pai li {
            padding: 13px 15px;
            border: 1px solid #d7d7d7;
            border-radius: 6px;
            background: #fafafa;
            cursor: pointer;
            transition: 0.2s;
        }

        .pai li:hover,
        .pai li:focus {
            outline: none;
            border-color: #5b4db8;
            background: #f0eeff;
        }

        .pai li.selecionado {
            border-color: #5b4db8;
            color: #fff;
            background: #5b4db8;
        }

        .item-especial {
            font-weight: bold;
        }

        .filho-4 {
            padding: 12px 15px;
            border-left: 4px solid #5b4db8;
            background: #f0eeff;
        }

        .pai-tio-1 {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pai-tio-1::before {
            width: 100%;
        }

        .irmao {
            padding: 10px 14px;
            border-radius: 20px;
            background: #e9f6ee;
            color: #23633a;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        label {
            width: 100%;
            font-weight: bold;
        }

        select,
        input[type="submit"] {
            min-height: 40px;
            padding: 8px 12px;
            border-radius: 5px;
            font: inherit;
        }

        select {
            flex: 1;
            min-width: 180px;
            border: 1px solid #ccc;
            background: #fff;
        }

        input[type="submit"] {
            border: 0;
            color: #fff;
            background: #5b4db8;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background: #453794;
        }

        #mensagemFeedback {
            max-width: 600px;
            margin: 0 auto;
            padding: 14px 16px;
            border: 1px solid #b8dfc5;
            border-radius: 6px;
            color: #23633a;
            background: #e9f6ee;
        }

        @media (max-width: 480px) {
            body {
                padding: 28px 16px;
            }

            h1 {
                font-size: 24px;
            }

            select,
            input[type="submit"] {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <h1>Exercício de Seletores CSS</h1>

    <p class="introducao">
        Selecione um familiar e registre sua opinião sobre os encontros de família.
    </p>

    <div class="pai" data-test="div-pai">
        <ul>
            <li class="filho-1" tabindex="0" role="button">Vovó Helena</li>
            <li class="filho-2 item-especial" tabindex="0" role="button">Tio Marcos</li>
            <li class="filho-3" tabindex="0" role="button">Prima Beatriz</li>
        </ul>

        <div class="filho-4" id="id-filho">
            Sobrenome: Andrade
        </div>
    </div>

    <div class="pai-tio-1" name="nome-do-atributo">
        <span class="irmao" id="irmao-1">Irmã Camila</span>
        <span class="irmao" id="irmao-2">Irmão Rafael</span>
    </div>

    <div class="pai-tio-2">
        <form id="formularioAvaliacao">
            <label for="opcao">Quanto você sente saudade dos encontros de família?</label>

            <select name="opcao" id="opcao">
                <option class="filho-1" value="none">Selecione</option>
                <option class="filho-2" value="muito">Muito</option>
                <option class="filho-3" value="medio">Médio</option>
                <option class="filho-4" value="pouco">Pouco</option>
            </select>

            <input id="id-enviar" type="submit" value="Enviar resposta">
        </form>
    </div>

    <p id="mensagemFeedback" style="display: none;">Obrigado por compartilhar conosco!</p>

    <script>
        const familiares = document.querySelectorAll(".pai li");

        familiares.forEach(function (familiar) {
            familiar.addEventListener("click", function () {
                familiares.forEach(function (item) {
                    item.classList.remove("selecionado");
                });

                familiar.classList.add("selecionado");
            });

            familiar.addEventListener("keydown", function (event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    familiar.click();
                }
            });
        });

        document.getElementById("formularioAvaliacao").addEventListener("submit", function (event) {
            event.preventDefault();
            document.getElementById("mensagemFeedback").style.display = "block";
        });
    </script>
</body>

</html>
